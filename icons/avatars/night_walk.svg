<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: Night Walker with Flashlight Beam (Facing UP / North) -->
  <defs>
    <radialGradient id="lightBeam" cx="50%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.0"/>
    </radialGradient>
    <filter id="nightShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Conical Light Beam projecting forward into the dark -->
  <polygon points="60,40 20,4 100,4" fill="url(#lightBeam)"/>

  <!-- Shoes -->
  <ellipse cx="50" cy="48" rx="5" ry="9" fill="#0f172a"/>
  <ellipse cx="70" cy="80" rx="5" ry="9" fill="#0f172a"/>

  <g filter="url(#nightShadow)">
    <!-- Dark Jacket with Hi-Vis Reflective Neon Straps -->
    <ellipse cx="60" cy="64" rx="25" ry="14" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>

    <!-- High-Visibility Reflective Cross-Belt -->
    <line x1="42" y1="58" x2="78" y2="70" stroke="#a3e635" stroke-width="3"/>
    <line x1="78" y1="58" x2="42" y2="70" stroke="#a3e635" stroke-width="3"/>

    <!-- Flashlight held in Right Hand pointing Forward -->
    <rect x="74" y="38" width="6" height="14" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <polygon points="74,38 80,38 82,34 72,34" fill="#fef08a"/>
    <circle cx="77" cy="48" r="4.5" fill="#fde68a"/>

    <!-- Left Hand -->
    <circle cx="38" cy="66" r="4.5" fill="#fde68a"/>

    <!-- Head -->
    <circle cx="60" cy="62" r="13" fill="#334155"/>
    <circle cx="60" cy="61" r="10" fill="#1e293b"/>
    <!-- Nose Direction -->
    <polygon points="60,46 57,52 63,52" fill="#fde68a"/>
  </g>
</svg>
