<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: Senior Pedestrian with Cane (Facing UP / North) -->
  <defs>
    <filter id="seniorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Shoes -->
  <ellipse cx="51" cy="46" rx="5" ry="8" fill="#475569"/>
  <ellipse cx="69" cy="72" rx="5" ry="8" fill="#475569"/>

  <g filter="url(#seniorShadow)">
    <!-- Walking Cane extending forward on right side -->
    <line x1="86" y1="62" x2="88" y2="30" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <circle cx="88" cy="30" r="3.5" fill="#d97706"/>

    <!-- Senior Coat Shoulders (Warm Earth Tone) -->
    <ellipse cx="60" cy="60" rx="24" ry="14" fill="#b45309" stroke="#78350f" stroke-width="2"/>

    <!-- Hands -->
    <circle cx="36" cy="58" r="5" fill="#fde68a"/>
    <circle cx="85" cy="56" r="5" fill="#fde68a"/>

    <!-- Silver/Grey Hair and Head -->
    <circle cx="60" cy="58" r="13" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="60" cy="57" r="9" fill="#cbd5e1"/>
    <!-- Nose / Direction -->
    <polygon points="60,42 57,48 63,48" fill="#fde68a"/>
  </g>
</svg>
