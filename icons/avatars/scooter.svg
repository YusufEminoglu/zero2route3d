<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: E-Scooter with Rider (Facing UP / North) -->
  <defs>
    <filter id="scooterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Small Front and Rear Wheels -->
  <rect x="58" y="14" width="4" height="16" rx="2" fill="#0f172a"/>
  <rect x="58" y="90" width="4" height="16" rx="2" fill="#0f172a"/>

  <!-- Narrow Standing Deck (Centerboard) -->
  <rect x="52" y="26" width="16" height="68" rx="6" fill="#14b8a6" stroke="#0f766e" stroke-width="2"/>
  <rect x="55" y="32" width="10" height="56" rx="3" fill="#1e293b"/>

  <!-- Handlebar T-Bar -->
  <line x1="42" y1="28" x2="78" y2="28" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <rect x="38" y="26" width="6" height="4" rx="1" fill="#0f172a"/>
  <rect x="76" y="26" width="6" height="4" rx="1" fill="#0f172a"/>

  <!-- Front LED Headlight Beam Spot -->
  <polygon points="56,12 64,12 68,4 52,4" fill="#fef08a" opacity="0.6"/>

  <g filter="url(#scooterShadow)">
    <!-- Standing Rider Shoulders (Upright Posture) -->
    <ellipse cx="60" cy="56" rx="20" ry="12" fill="#0d9488" stroke="#0f766e" stroke-width="2"/>

    <!-- Arms holding handlebar grips -->
    <line x1="44" y1="52" x2="41" y2="30" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="41" cy="29" r="4" fill="#fde68a"/>
    <line x1="76" y1="52" x2="79" y2="30" stroke="#0d9488" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="79" cy="29" r="4" fill="#fde68a"/>

    <!-- Rider Helmet -->
    <circle cx="60" cy="52" r="12" fill="#1e293b"/>
    <circle cx="60" cy="51" r="8" fill="#14b8a6"/>
  </g>
</svg>
