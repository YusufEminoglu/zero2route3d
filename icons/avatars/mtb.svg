<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: Mountain Bike MTB (Facing UP / North) -->
  <defs>
    <filter id="mtbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Wide Knobby Front & Rear Tires -->
  <rect x="57" y="8" width="6" height="28" rx="2" fill="#0f172a"/>
  <rect x="57" y="84" width="6" height="28" rx="2" fill="#0f172a"/>

  <!-- Aggressive Wide MTB Handlebars -->
  <line x1="36" y1="34" x2="84" y2="34" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
  <rect x="32" y="31" width="8" height="6" rx="2" fill="#10b981"/>
  <rect x="80" y="31" width="8" height="6" rx="2" fill="#10b981"/>

  <!-- Heavy Down Tube / Frame -->
  <line x1="60" y1="24" x2="60" y2="94" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>

  <g filter="url(#mtbShadow)">
    <!-- Rider Shoulders in Active Attack Position -->
    <ellipse cx="60" cy="54" rx="24" ry="13" fill="#047857" stroke="#064e3b" stroke-width="2"/>

    <!-- Arms -->
    <line x1="42" y1="52" x2="36" y2="36" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
    <circle cx="36" cy="35" r="4.5" fill="#fde68a"/>
    <line x1="78" y1="52" x2="84" y2="36" stroke="#047857" stroke-width="6" stroke-linecap="round"/>
    <circle cx="84" cy="35" r="4.5" fill="#fde68a"/>

    <!-- MTB Helmet with Visor pointing UP -->
    <polygon points="60,36 50,44 70,44" fill="#10b981"/>
    <circle cx="60" cy="52" r="11" fill="#0f172a"/>
    <circle cx="60" cy="52" r="7" fill="#10b981"/>
  </g>
</svg>
