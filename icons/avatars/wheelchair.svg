<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: Manual / Powered Wheelchair (Facing UP / North) -->
  <defs>
    <filter id="wheelchairShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Large Side Wheels (Left & Right Rims) -->
  <rect x="28" y="38" width="6" height="48" rx="3" fill="#0f172a"/>
  <rect x="26" y="42" width="2" height="40" rx="1" fill="#cbd5e1"/>

  <rect x="86" y="38" width="6" height="48" rx="3" fill="#0f172a"/>
  <rect x="92" y="42" width="2" height="40" rx="1" fill="#cbd5e1"/>

  <!-- Front Casters -->
  <rect x="36" y="24" width="4" height="12" rx="2" fill="#334155"/>
  <rect x="80" y="24" width="4" height="12" rx="2" fill="#334155"/>

  <!-- Footrests extending forward -->
  <rect x="44" y="20" width="12" height="6" rx="2" fill="#475569"/>
  <rect x="64" y="20" width="12" height="6" rx="2" fill="#475569"/>

  <g filter="url(#wheelchairShadow)">
    <!-- Wheelchair Seat / Cushion -->
    <rect x="36" y="36" width="48" height="48" rx="4" fill="#6d28d9" stroke="#4c1d95" stroke-width="2"/>

    <!-- Seated User Shoulders -->
    <ellipse cx="60" cy="56" rx="22" ry="12" fill="#8b5cf6" stroke="#5b21b6" stroke-width="2"/>

    <!-- Hands on Push Rims / Armrests -->
    <circle cx="31" cy="58" r="4.5" fill="#fde68a"/>
    <line x1="44" y1="56" x2="31" y2="58" stroke="#5b21b6" stroke-width="4.5" stroke-linecap="round"/>

    <circle cx="89" cy="58" r="4.5" fill="#fde68a"/>
    <line x1="76" y1="56" x2="89" y2="58" stroke="#5b21b6" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="60" cy="54" r="12" fill="#1e293b"/>
    <circle cx="60" cy="53" r="8" fill="#334155"/>
    <!-- Nose Direction -->
    <polygon points="60,40 57,46 63,46" fill="#fde68a"/>
  </g>
</svg>
