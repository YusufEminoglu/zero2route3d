<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: Runner / Jogger (Facing UP / North) -->
  <defs>
    <filter id="joggerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Running Shoes in dynamic stride -->
  <ellipse cx="48" cy="28" rx="5" ry="10" fill="#ec4899"/>
  <ellipse cx="72" cy="88" rx="5" ry="10" fill="#ec4899"/>

  <g filter="url(#joggerShadow)">
    <!-- Athletic Sleeveless Jersey (Neon Emerald / Cyan) -->
    <ellipse cx="60" cy="58" rx="22" ry="12" fill="#10b981" stroke="#047857" stroke-width="2"/>

    <!-- Pumping Arms (Right Arm Forward, Left Arm Back) -->
    <circle cx="36" cy="74" r="5.5" fill="#fed7aa"/>
    <line x1="42" y1="58" x2="36" y2="74" stroke="#047857" stroke-width="4" stroke-linecap="round"/>

    <circle cx="84" cy="42" r="5.5" fill="#fed7aa"/>
    <line x1="78" y1="58" x2="84" y2="42" stroke="#047857" stroke-width="4" stroke-linecap="round"/>

    <!-- Head & Headband -->
    <circle cx="60" cy="56" r="12" fill="#1e293b"/>
    <!-- Headband -->
    <ellipse cx="60" cy="50" rx="11" ry="3.5" fill="#ec4899"/>
    <!-- Nose Direction -->
    <polygon points="60,39 57,45 63,45" fill="#fed7aa"/>
  </g>
</svg>
