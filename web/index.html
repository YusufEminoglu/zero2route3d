<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02Route 3D Studio - Mobility Cockpit</title>
  <link rel="stylesheet" href="css/studio3d.css">
</head>
<body>
  <!-- 3D WebGL Canvas Container -->
  <div id="canvasContainer"></div>

  <!-- Empty Overlay Placeholder -->
  <div id="emptyOverlay">
    <div class="empty-icon">🗺️</div>
    <div class="empty-text">Select Start & Destination in QGIS<br>to compute 3D route corridor</div>
  </div>

  <!-- Top Floating HUD -->
  <div class="hud-panel top-hud">
    <div class="brand-section">
      <span class="brand-badge">02Route 3D</span>
      <span class="brand-title">Mobility Studio</span>
    </div>

    <!-- DİRİ-Inspired Scenario Switcher -->
    <div class="scenario-selector">
      <button class="scenario-btn active" data-scenario="shortest" title="Standard Shortest Path">
        <span>⚡</span> Shortest
      </button>
      <button class="scenario-btn" data-scenario="green" title="Shade & Greenery Cool Corridor">
        <span>🌿</span> Green/Shade
      </button>
      <button class="scenario-btn" data-scenario="ada" title="Barrier-Free ADA Accessibility">
        <span>♿</span> Barrier-Free
      </button>
      <button class="scenario-btn" data-scenario="cycle" title="Active Micro-Mobility & Cycling">
        <span>🚲</span> Micro-Mobility
      </button>
    </div>

    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Distance</span>
        <span class="stat-value" id="valDistance">—</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Duration</span>
        <span class="stat-value" id="valDuration">—</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Elevation Climb</span>
        <span class="stat-value" id="valClimb">—</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Max Slope</span>
        <span class="stat-value" id="valMaxSlope">—</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Energy Burn</span>
        <span class="stat-value" id="valCalories">—</span>
      </div>
    </div>
  </div>

  <!-- Left Mini-Radar Overview Map -->
  <div class="hud-panel minimap-radar">
    <canvas id="radarCanvas" width="130" height="130"></canvas>
    <div class="compass-indicator" id="compassRose" title="Snap to North">N</div>
  </div>

  <!-- Right Toolbar: Camera & View Modes -->
  <div class="hud-panel right-tools">
    <div class="tool-group-title">Camera Mode</div>
    <button class="tool-btn cam-btn" data-cam="orbit" title="Free 360 Orbit Camera">
      <span>🌐</span> Orbit
    </button>
    <button class="tool-btn cam-btn active" data-cam="chase" title="Drone Chase Follow Camera">
      <span>🛸</span> Chase
    </button>
    <button class="tool-btn cam-btn" data-cam="pov" title="First-Person Driver/Walker View">
      <span>👁️</span> POV
    </button>
    <button class="tool-btn cam-btn" data-cam="tour" title="Cinematic Fly-Through Tour">
      <span>🎬</span> Tour
    </button>

    <div class="tool-group-title">3D Layer Controls</div>
    <button class="tool-btn active" id="btnBasemap" title="Toggle Real OpenStreetMap Ground Basemap">
      <span>🗺️</span> Basemap: <b>ON</b>
    </button>
    <button class="tool-btn active" id="btnBuildings" title="Toggle 3D Extruded OSM Buildings">
      <span>🏢</span> Buildings: <b>ON</b>
    </button>
    <button class="tool-btn active" id="btnTrees" title="Toggle Volumetric 3D Trees">
      <span>🌳</span> Trees: <b>ON</b>
    </button>
    <button class="tool-btn" id="btnExaggeration" title="Cycle Terrain Vertical Exaggeration (1x/2x/3x/5x)">
      <span>⛰️</span> Exag: <b id="lblExag">1.5x</b>
    </button>
    <button class="tool-btn" id="btnSlicer" title="Toggle 3D Underground Geological Slicer Plane">
      <span>🔪</span> Slicer
    </button>

    <div class="tool-group-title">Capture & Tools</div>
    <button class="tool-btn" id="btnSnapshot" title="High-Res Canvas Snapshot">
      <span>📸</span> Snapshot
    </button>
    <button class="tool-btn" id="btnRecord" title="Record 60 FPS WebM Video">
      <span>🎥</span> Record
    </button>
    <button class="tool-btn" id="btnResetView" title="Reset Camera to Extent">
      <span>🔄</span> Reset
    </button>
  </div>

  <!-- Bottom Player & Scrubber -->
  <div class="hud-panel bottom-controls">
    <button class="btn-play" id="btnPlay" title="Play/Pause 3D Centerline Simulation">
      <span id="playIcon">▶</span>
    </button>

    <div class="scrubber-container">
      <div class="elevation-profile-chart" id="chartDrawer">
        <svg id="profileSvg" width="100%" height="100%"></svg>
        <div class="profile-needle" id="profileNeedle"></div>
      </div>
      <input type="range" class="scrubber-slider" id="scrubber" min="0" max="1000" value="0">
    </div>

    <div class="speed-selector">
      <button class="speed-opt active" data-speed="1.0">1x</button>
      <button class="speed-opt" data-speed="2.0">2x</button>
      <button class="speed-opt" data-speed="4.0">4x</button>
    </div>
  </div>

  <script type="module" src="js/app3d.js"></script>
</body>
</html>
