<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: Paramedic / Emergency Ambulance (Facing UP / North) -->
  <defs>
    <filter id="paramedicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Wheels -->
  <rect x="33" y="24" width="6" height="18" rx="2" fill="#0f172a"/>
  <rect x="81" y="24" width="6" height="18" rx="2" fill="#0f172a"/>
  <rect x="33" y="78" width="6" height="18" rx="2" fill="#0f172a"/>
  <rect x="81" y="78" width="6" height="18" rx="2" fill="#0f172a"/>

  <!-- Mirrors -->
  <rect x="31" y="38" width="6" height="4" rx="2" fill="#ef4444" stroke="#0f172a" stroke-width="1"/>
  <rect x="83" y="38" width="6" height="4" rx="2" fill="#ef4444" stroke="#0f172a" stroke-width="1"/>

  <g filter="url(#paramedicShadow)">
    <!-- Ambulance Body (White with Red Highlights) -->
    <path d="M 42,12 C 50,10 70,10 78,12 C 84,14 86,22 86,34 L 86,98 C 86,106 82,108 76,108 C 68,108 52,108 44,108 C 38,108 34,106 34,98 L 34,34 C 34,22 36,14 42,12 Z"
          fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/>

    <!-- Windshield -->
    <path d="M 40,32 L 80,32 C 78,40 76,43 75,44 L 45,44 C 44,43 42,40 40,32 Z"
          fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Red Medical Cross on Roof -->
    <rect x="56" y="62" width="8" height="24" rx="1" fill="#ef4444"/>
    <rect x="48" y="70" width="24" height="8" rx="1" fill="#ef4444"/>

    <!-- Emergency Flashing Light Bar on Roof (Red & Blue) -->
    <rect x="42" y="47" width="16" height="5" rx="1" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
    <rect x="62" y="47" width="16" height="5" rx="1" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="58" y="47" width="4" height="5" fill="#f8fafc"/>

    <!-- Headlights (High-Intensity LED) -->
    <polygon points="38,13 46,13 45,19 39,19" fill="#fef08a"/>
    <polygon points="74,13 82,13 81,19 75,19" fill="#fef08a"/>

    <!-- Rear Red Lights -->
    <rect x="37" y="105" width="8" height="3" rx="1" fill="#ef4444"/>
    <rect x="75" y="105" width="8" height="3" rx="1" fill="#ef4444"/>
  </g>
</svg>
