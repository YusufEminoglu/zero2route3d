<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: City Bicycle with Cyclist (Facing UP / North) -->
  <defs>
    <filter id="bikeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Front Wheel (Thin long rectangle at top) -->
  <rect x="58" y="10" width="4" height="26" rx="2" fill="#0f172a"/>
  <!-- Rear Wheel (Thin long rectangle at bottom) -->
  <rect x="58" y="84" width="4" height="26" rx="2" fill="#0f172a"/>

  <!-- Bicycle Frame Tube Line -->
  <line x1="60" y1="26" x2="60" y2="94" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>

  <!-- Handlebars (Perpendicular bar at front) -->
  <line x1="42" y1="36" x2="78" y2="36" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <!-- Rubber Grips -->
  <rect x="38" y="34" width="6" height="5" rx="2" fill="#0f172a"/>
  <rect x="76" y="34" width="6" height="5" rx="2" fill="#0f172a"/>

  <!-- Saddle (Seat) -->
  <polygon points="60,68 54,82 66,82" fill="#0f172a"/>

  <g filter="url(#bikeShadow)">
    <!-- Cyclist Shoulders (Leaning forward) -->
    <ellipse cx="60" cy="56" rx="22" ry="12" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>

    <!-- Cyclist Arms reaching to Handlebars -->
    <line x1="44" y1="52" x2="41" y2="38" stroke="#0369a1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="41" cy="37" r="4" fill="#fde68a"/>
    <line x1="76" y1="52" x2="79" y2="38" stroke="#0369a1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="79" cy="37" r="4" fill="#fde68a"/>

    <!-- Cyclist Helmet (Aerodynamic teardrop pointing backwards) -->
    <path d="M 60,42 C 54,42 52,48 52,56 C 52,65 58,72 60,74 C 62,72 68,65 68,56 C 68,48 66,42 60,42 Z"
          fill="#06b6d4" stroke="#0e7490" stroke-width="1.5"/>
    <line x1="60" y1="44" x2="60" y2="70" stroke="#cffafe" stroke-width="2"/>
  </g>
</svg>
