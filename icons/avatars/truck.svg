<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: Heavy Cargo Truck (Facing UP / North) -->
  <defs>
    <filter id="truckShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Wheels (Tandem Dual Axles) -->
  <rect x="28" y="22" width="7" height="18" rx="2" fill="#0f172a"/>
  <rect x="85" y="22" width="7" height="18" rx="2" fill="#0f172a"/>
  <rect x="26" y="70" width="8" height="17" rx="2" fill="#0f172a"/>
  <rect x="86" y="70" width="8" height="17" rx="2" fill="#0f172a"/>
  <rect x="26" y="90" width="8" height="17" rx="2" fill="#0f172a"/>
  <rect x="86" y="90" width="8" height="17" rx="2" fill="#0f172a"/>

  <!-- Wide Mirrors -->
  <rect x="26" y="32" width="8" height="4" rx="2" fill="#334155"/>
  <rect x="86" y="32" width="8" height="4" rx="2" fill="#334155"/>

  <g filter="url(#truckShadow)">
    <!-- Cabin (Front) -->
    <path d="M 38,10 C 48,8 72,8 82,10 C 88,12 90,20 90,32 L 90,44 L 30,44 L 30,32 C 30,20 32,12 38,10 Z"
          fill="#475569" stroke="#1e293b" stroke-width="2"/>

    <!-- Cabin Windshield -->
    <path d="M 36,22 L 84,22 C 82,30 80,33 78,34 L 42,34 C 40,33 38,30 36,22 Z"
          fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>

    <!-- Air Deflector / Roof -->
    <rect x="42" y="34" width="36" height="8" rx="1" fill="#334155"/>

    <!-- Gap / Hitch -->
    <rect x="52" y="44" width="16" height="8" fill="#1e293b"/>

    <!-- Cargo Container Body -->
    <rect x="32" y="50" width="56" height="60" rx="3" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
    <!-- Container Corrugations -->
    <line x1="36" y1="62" x2="84" y2="62" stroke="#334155" stroke-width="2"/>
    <line x1="36" y1="74" x2="84" y2="74" stroke="#334155" stroke-width="2"/>
    <line x1="36" y1="86" x2="84" y2="86" stroke="#334155" stroke-width="2"/>
    <line x1="36" y1="98" x2="84" y2="98" stroke="#334155" stroke-width="2"/>

    <!-- Front Heavy Lights -->
    <polygon points="34,11 44,11 43,17 35,17" fill="#fef08a"/>
    <polygon points="76,11 86,11 85,17 77,17" fill="#fef08a"/>

    <!-- Rear Hazard Stripes -->
    <rect x="34" y="108" width="12" height="3" rx="1" fill="#ef4444"/>
    <rect x="74" y="108" width="12" height="3" rx="1" fill="#ef4444"/>
  </g>
</svg>
