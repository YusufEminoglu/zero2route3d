<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: Baby Stroller with Parent Pusher (Facing UP / North) -->
  <defs>
    <filter id="strollerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Stroller 4 Wheels (2 Front, 2 Rear) -->
  <rect x="36" y="16" width="4" height="12" rx="2" fill="#0f172a"/>
  <rect x="80" y="16" width="4" height="12" rx="2" fill="#0f172a"/>
  <rect x="34" y="56" width="5" height="14" rx="2" fill="#0f172a"/>
  <rect x="81" y="56" width="5" height="14" rx="2" fill="#0f172a"/>

  <!-- Stroller Frame Chassis -->
  <rect x="38" y="20" width="44" height="46" rx="6" fill="#f43f5e" stroke="#be123c" stroke-width="2"/>
  <!-- Sun Canopy (Folded dome top view) -->
  <path d="M 42,32 C 42,22 78,22 78,32 L 78,48 C 78,48 42,48 42,48 Z" fill="#fb7185" stroke="#be123c" stroke-width="1.5"/>

  <!-- Stroller Push Handlebar -->
  <line x1="42" y1="72" x2="78" y2="72" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#strollerShadow)">
    <!-- Parent Pusher Shoulders (Behind Stroller) -->
    <ellipse cx="60" cy="94" rx="24" ry="13" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>

    <!-- Parent Arms holding handlebar -->
    <line x1="42" y1="90" x2="44" y2="74" stroke="#0369a1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="44" cy="73" r="4.5" fill="#fde68a"/>
    <line x1="78" y1="90" x2="76" y2="74" stroke="#0369a1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="76" cy="73" r="4.5" fill="#fde68a"/>

    <!-- Parent Head -->
    <circle cx="60" cy="92" r="12" fill="#1e293b"/>
    <circle cx="60" cy="91" r="8" fill="#334155"/>
    <!-- Nose Direction -->
    <polygon points="60,78 57,84 63,84" fill="#fde68a"/>
  </g>
</svg>
