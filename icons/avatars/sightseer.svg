<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: Tourist / Sightseer (Facing UP / North) -->
  <defs>
    <filter id="touristShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Shoes -->
  <ellipse cx="51" cy="42" rx="5" ry="8" fill="#78350f"/>
  <ellipse cx="69" cy="76" rx="5" ry="8" fill="#78350f"/>

  <g filter="url(#touristShadow)">
    <!-- Shoulders & Torso (Safari Green / Teal Shirt) -->
    <ellipse cx="60" cy="60" rx="25" ry="14" fill="#0d9488" stroke="#115e59" stroke-width="2"/>

    <!-- Backpack on Back -->
    <rect x="48" y="66" width="24" height="12" rx="3" fill="#92400e" stroke="#78350f" stroke-width="1.5"/>

    <!-- Camera slung in front (held by hands) -->
    <rect x="52" y="38" width="16" height="9" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
    <circle cx="60" cy="42" r="3" fill="#38bdf8"/>
    <!-- Hands holding camera -->
    <circle cx="48" cy="42" r="4.5" fill="#fde68a"/>
    <circle cx="72" cy="42" r="4.5" fill="#fde68a"/>

    <!-- Broad-Brimmed Sun Hat (Top View) -->
    <circle cx="60" cy="58" r="17" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="60" cy="58" r="11" fill="#eab308"/>
    <circle cx="60" cy="58" r="7" fill="#ca8a04"/>
  </g>
</svg>
