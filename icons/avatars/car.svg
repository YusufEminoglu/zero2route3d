<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: Sedan Car (Facing UP / North) -->
  <defs>
    <filter id="carShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="carGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Wheels (Tires seen from top) -->
  <rect x="34" y="26" width="6" height="18" rx="2" fill="#0f172a"/>
  <rect x="80" y="26" width="6" height="18" rx="2" fill="#0f172a"/>
  <rect x="34" y="76" width="6" height="18" rx="2" fill="#0f172a"/>
  <rect x="80" y="76" width="6" height="18" rx="2" fill="#0f172a"/>

  <!-- Side Mirrors -->
  <rect x="33" y="44" width="6" height="4" rx="2" fill="#0284c7" stroke="#0f172a" stroke-width="1"/>
  <rect x="81" y="44" width="6" height="4" rx="2" fill="#0284c7" stroke="#0f172a" stroke-width="1"/>

  <!-- Main Chassis -->
  <g filter="url(#carShadow)">
    <!-- Car Body Contour -->
    <path d="M 44,14 C 52,12 68,12 76,14 C 82,16 84,24 84,36 L 84,86 C 84,98 80,106 74,107 C 66,108 54,108 46,107 C 40,106 36,98 36,86 L 36,36 C 36,24 38,16 44,14 Z"
          fill="url(#carBody)" stroke="#0c4a6e" stroke-width="2"/>

    <!-- Hood Line -->
    <path d="M 42,36 C 50,34 70,34 78,36" stroke="#0284c7" stroke-width="1.5" fill="none"/>

    <!-- Front Windshield -->
    <path d="M 43,42 L 77,42 C 75,50 74,52 73,53 L 47,53 C 46,52 45,50 43,42 Z"
          fill="url(#carGlass)" stroke="#38bdf8" stroke-width="1"/>

    <!-- Roof -->
    <rect x="46" y="53" width="28" height="23" rx="2" fill="#0369a1"/>

    <!-- Rear Window -->
    <path d="M 47,76 L 73,76 C 75,77 76,82 77,85 L 43,85 C 44,82 45,77 47,76 Z"
          fill="url(#carGlass)" stroke="#38bdf8" stroke-width="1"/>

    <!-- Headlights (Front - Bright Xenon Glow) -->
    <polygon points="41,15 48,15 47,21 42,21" fill="#fef08a" stroke="#ca8a04" stroke-width="0.5"/>
    <polygon points="72,15 79,15 78,21 73,21" fill="#fef08a" stroke="#ca8a04" stroke-width="0.5"/>

    <!-- Taillights (Rear - Red) -->
    <rect x="40" y="103" width="9" height="3" rx="1" fill="#ef4444"/>
    <rect x="71" y="103" width="9" height="3" rx="1" fill="#ef4444"/>
  </g>
</svg>
