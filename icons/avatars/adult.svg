<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: Pedestrian / Adult (Facing UP / North) -->
  <defs>
    <filter id="walkerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Shoes / Feet peeking out during stride -->
  <ellipse cx="50" cy="38" rx="5" ry="9" fill="#1e293b"/>
  <ellipse cx="70" cy="78" rx="5" ry="9" fill="#1e293b"/>

  <g filter="url(#walkerShadow)">
    <!-- Shoulders & Torso (Blue Jacket/Shirt) -->
    <ellipse cx="60" cy="60" rx="26" ry="14" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>

    <!-- Arms swinging forward/back -->
    <circle cx="34" cy="54" r="6" fill="#fbcfe8" stroke="#0369a1" stroke-width="1.5"/>
    <circle cx="86" cy="66" r="6" fill="#fbcfe8" stroke="#0369a1" stroke-width="1.5"/>

    <!-- Head & Hair (Centered) -->
    <circle cx="60" cy="58" r="14" fill="#1e293b"/>
    <!-- Face / Nose Direction Indicator pointing UP -->
    <polygon points="60,40 56,47 64,47" fill="#fbcfe8"/>
    <!-- Head Crown -->
    <circle cx="60" cy="57" r="11" fill="#334155"/>
  </g>
</svg>
