<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Top-down Overhead View: Child Pedestrian (Facing UP / North) -->
  <defs>
    <filter id="childShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Small Shoes -->
  <ellipse cx="52" cy="44" rx="4" ry="7" fill="#dc2626"/>
  <ellipse cx="68" cy="74" rx="4" ry="7" fill="#dc2626"/>

  <g filter="url(#childShadow)">
    <!-- Small Shoulders (Bright Amber/Yellow Shirt) -->
    <ellipse cx="60" cy="60" rx="18" ry="10" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>

    <!-- School Backpack on Back -->
    <rect x="50" y="62" width="20" height="12" rx="3" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>

    <!-- Hands -->
    <circle cx="42" cy="56" r="4.5" fill="#fde68a"/>
    <circle cx="78" cy="64" r="4.5" fill="#fde68a"/>

    <!-- Head & Cap (Facing UP) -->
    <circle cx="60" cy="56" r="11" fill="#fde047"/>
    <!-- Cap Visor pointing UP -->
    <path d="M 52,48 C 56,43 64,43 68,48 Z" fill="#2563eb"/>
    <circle cx="60" cy="56" r="9" fill="#1d4ed8"/>
  </g>
</svg>
